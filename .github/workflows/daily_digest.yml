name: Daily Digest

on:
  schedule:
    - cron: '1 0 * * *'  # midnight UTC — arrives before Justin wakes up regardless of GHA delay
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  send_digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic google-api-python-client google-auth-oauthlib

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python scripts/daily_digest.py

      - name: Commit digest history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_history.json data/config.json
          git diff --staged --quiet || git commit -m "chore: update digest history [skip ci]"
          git push

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Daily Digest failed — action required';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'digest-failure',
            });
            if (issues.some(i => i.title === title)) {
              console.log('Open failure issue already exists — skipping duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['digest-failure'],
              body: [
                '## The Daily Digest failed to send',
                '',
                `**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### Most likely cause',
                'The `GOOGLE_TOKEN` secret has expired or been revoked.',
                '',
                '### Fix (5 minutes)',
                '1. On your Mac, run: `python3 ~/Personal-Optimization/scripts/auth_setup.py`',
                '2. Complete the Google sign-in in the browser that opens',
                '3. Copy the output of: `cat ~/Personal-Optimization/scripts/token.json`',
                '4. Go to **Settings → Secrets → Actions → `GOOGLE_TOKEN`** in this repo and paste the new value',
                '5. Re-run the workflow from the Actions tab',
                '',
                'Close this issue once resolved.',
              ].join('\n'),
            });
