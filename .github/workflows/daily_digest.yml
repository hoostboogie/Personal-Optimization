name: Daily Digest

on:
  schedule:
    - cron: '1 0 * * *'  # midnight UTC — arrives before Justin wakes up regardless of GHA delay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send_digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic google-api-python-client google-auth-oauthlib

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python scripts/daily_digest.py

      - name: Commit digest history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_history.json
          git diff --staged --quiet || git commit -m "chore: update digest history [skip ci]"
          git push
